<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Animated 3D wireframe globe orbiting through a star field">
  <defs>
    <radialGradient id="bg"><stop stop-color="#152b50"/><stop offset="1" stop-color="#070c1c"/></radialGradient>
    <radialGradient id="globe"><stop stop-color="#183c67" stop-opacity=".48"/><stop offset="1" stop-color="#102243" stop-opacity=".08"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .meridians { transform-box:fill-box; transform-origin:center; animation:turn 7s ease-in-out infinite; }
      .satellite { transform-box:fill-box; transform-origin:480px 150px; animation:orbit 5s linear infinite; }
      @keyframes turn { 0%,100%{transform:scaleX(1)} 25%{transform:scaleX(.12)} 50%{transform:scaleX(1)} 75%{transform:scaleX(.12)} }
      @keyframes orbit { to { transform:rotate(360deg) } }
      @media (prefers-reduced-motion:reduce) { .meridians,.satellite { animation:none } }
    </style>
  </defs>
  <rect width="960" height="300" rx="18" fill="url(#bg)"/>
  <g fill="#b8d6ff" opacity=".48">
    <circle cx="75" cy="45" r="1.5"/><circle cx="205" cy="216" r="1"/><circle cx="292" cy="62" r="1.2"/><circle cx="728" cy="54" r="1"/><circle cx="812" cy="215" r="1.5"/><circle cx="896" cy="82" r="1"/><circle cx="683" cy="256" r="1"/><circle cx="355" cy="251" r="1.2"/>
  </g>
  <text x="60" y="102" fill="#85cfff" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">EXPLORE</text>
  <text x="60" y="139" fill="#f2f6ff" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="1">THE DIGITAL</text>
  <text x="60" y="173" fill="#f2f6ff" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="1">UNIVERSE</text>
  <rect x="60" y="190" width="136" height="3" rx="2" fill="#52bdff"/>
  <text x="60" y="221" fill="#9aaccc" font-family="Arial,sans-serif" font-size="15" letter-spacing="1">Curiosity in motion</text>
  <g filter="url(#glow)">
    <circle cx="480" cy="150" r="105" fill="url(#globe)" stroke="#50b8ff" stroke-width="3"/>
    <g fill="none" stroke="#409cff" stroke-width="1.5" opacity=".74">
      <ellipse cx="480" cy="150" rx="105" ry="25"/><ellipse cx="480" cy="150" rx="105" ry="55"/><ellipse cx="480" cy="150" rx="105" ry="82"/>
    </g>
    <g class="meridians" fill="none" stroke="#8394ff" stroke-width="2" opacity=".82">
      <ellipse cx="480" cy="150" rx="22" ry="105"/><ellipse cx="480" cy="150" rx="53" ry="105"/><ellipse cx="480" cy="150" rx="82" ry="105"/>
    </g>
    <ellipse cx="480" cy="150" rx="144" ry="39" fill="none" stroke="#ae70ff" stroke-width="2" opacity=".65"/>
    <circle class="satellite" cx="624" cy="150" r="5" fill="#ffdc82"/>
  </g>
  <text x="720" y="137" fill="#9cc8ff" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">KEEP</text>
  <text x="720" y="159" fill="#eaf1ff" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">EXPLORING</text>
</svg>
